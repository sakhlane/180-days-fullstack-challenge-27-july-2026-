<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-management-system</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!---------------- WHOLE BODY APP CONTAINER ------------------------------------------------->
    <div class="app-container">
        <!-- SIDE BAR -->
        <aside class="side-bar">
            <div class="logo">
                <img src="" alt="student management system logo">
                <h1>Student Management System</h1>
            </div>
            <nav class="menu">
                <a href="#">
                 <i data-lucide="house"></i><span>Dashboard</span> 
                </a>
                <a href="#">
                 <i data-lucide="users"></i><span>All Students</span> 
                </a>
                <a href="#">
                 <i data-lucide="circle-plus"></i><span>Add Students</span> 
                </a>
                <a href="#">
                 <i data-lucide="book-open"></i><span>Courses</span> 
                </a>
                <a href="#">
                 <i data-lucide="chart-no-axes-column-increasing"></i><span>Reports</span> 
                </a>
                <a href="#">
                 <i data-lucide="settings"></i><span>Settings</span> 
                </a>
                
            </nav>
            <div class="image">
                <img src="./assets/images/undraw_books_wxzz.svg" alt="Books Image">
            </div>
            <div class="profile">
                <div class="profile-image">
                    <img src="" alt="student profile image">
                </div>
                <div class="student-info">
                    <h3>sakhlane</h3>
                    <p>Administrator</p>
                </div>
                <button class="logout-btn">
                   <i data-lucide="log-out"></i>
                </button>
            </div>
        </aside>
        <!-- MAIN CONTAINER -->
         <main class="main-container">
            <!-- HEADER SECTION -->
            <header class="header">

            </header>
            <!-- ADD STUDENTS -->
             <section class="add-students"></section>
             <!-- STATISTICS -->
            <section class="statistics"></section>
            <!-- STUDENTS -->
             <section class="students"></section>
         </main>
    </div>
    <!-- script for link lucide icon  -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
